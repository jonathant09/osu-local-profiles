name: Release

# Pushing a version tag builds the app on each platform it ships for and attaches the three
# archives to that version's GitHub release.
#
# A package can only be built on the system it is for -- it bundles the Node binary that
# built it (see scripts/package.mjs) -- so each archive comes from a runner of its own OS.
# The updater looks for exactly these names (assetNameFor in src/update/github.ts).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach, e.g. v1.10.0. Empty builds all three and releases nothing.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # The plays the slim pp helper is checked against on each platform (roadmap 5.60): replays and
  # beatmaps exported by `node scripts/pp-parity.mjs --export`, encrypted with the
  # PP_PARITY_KEY secret, kept as the asset of a *draft* release tagged `pp-parity-corpus`,
  # which only maintainers can see. Reading a draft needs write access, so this job alone has
  # it -- and runs nothing from npm -- and hands the file on still encrypted, for one day.
  #
  # Missing or unreadable, nothing fails: each platform then ships its full pp helper, as
  # before 5.60, and says so in the run's summary.
  parity-corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the encrypted parity corpus
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download pp-parity-corpus --repo "$GITHUB_REPOSITORY" \
               --pattern pp-parity-corpus.bin --dir corpus; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=pp helper::no parity corpus (draft release pp-parity-corpus) -- every platform ships its full pp helper"
          fi

      - if: steps.fetch.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pp-parity-corpus
          path: corpus/pp-parity-corpus.bin
          retention-days: 1

  package:
    needs: parity-corpus
    strategy:
      # All or nothing: a release missing one platform's archive is worse than a late one,
      # because that platform's updater would find a release with nothing for it.
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          # Intel Macs, on a runner of that architecture -- the package bundles the runner's
          # own `node`, so an Intel build cannot be made on an Apple silicon machine. osu!
          # itself still ships osx-x64, and about a tenth of its macOS users are on it.
          # `macos-13` was retired; `macos-15-intel` is the standard (free) replacement.
          - os: macos-15-intel
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # This exact Node binary ships inside the archive, so pin it the way a release pins it.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Builds the tray launcher each package opens with (scripts/build-launcher.mjs).
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/launcher/go.mod
          cache-dependency-path: tools/launcher/go.sum

      - run: npm ci

      - name: The tag names the version being built
        if: github.event_name == 'push' || inputs.tag != ''
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      # Absent when there is no corpus; the package step then ships the full pp helper.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pp-parity-corpus
          path: ${{ runner.temp }}/corpus

      # Builds the pp helper -- full and slim, and the slim one only if it answers every parity
      # request as the full one does on this runner -- bundles the runtime, starts the result
      # from an unrelated directory to prove it finds its calculator, and zips it.
      - run: npm run package -- --rid ${{ matrix.rid }}
        env:
          PP_PARITY_CORPUS: ${{ runner.temp }}/corpus/pp-parity-corpus.bin
          PP_PARITY_KEY: ${{ secrets.PP_PARITY_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    # A manual run without a tag is a dry run of the packaging on all three systems.
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the release, or attach the builds to it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          ls -l assets
          if gh release view "$tag" > /dev/null 2>&1; then
            # Written by hand already: keep its notes, replace any builds of the same name.
            gh release upload "$tag" assets/*.zip --clobber
          else
            node scripts/release-notes.mjs "$version" > notes.md
            gh release create "$tag" assets/*.zip \
              --title "osu! local profiles $version" \
              --notes-file notes.md \
              --verify-tag
          fi
