name: Release

# Pushing a version tag builds the app on each platform it ships for and attaches the four
# archives to that version's GitHub release.
#
# Each package is the C# app (docs/csharp-port.md, phase 8), built and checked on a runner of
# its own system: the app is checked there against osu!'s calculators, trimmed only where it
# answers as the untrimmed one does, and started from another folder before it ships. Every
# updater since 1.7 looks for exactly these names (assetNameFor in src/update/github.ts), and
# finds the stand-ins it checks for beside the app (scripts/package.mjs).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach, e.g. v1.10.0. Empty builds all three and releases nothing.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    strategy:
      # All or nothing: a release missing one platform's archive is worse than a late one,
      # because that platform's updater would find a release with nothing for it.
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          # Intel Macs, on a runner of that architecture, where the app is checked running.
          # osu! itself still ships osx-x64, and about a tenth of its macOS users are on it.
          # `macos-13` was retired; `macos-15-intel` is the standard (free) replacement.
          - os: macos-15-intel
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Node runs the packaging and its checks; nothing of it ships.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Builds the tray launcher each package opens with (scripts/build-launcher.mjs).
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/launcher/go.mod
          cache-dependency-path: tools/launcher/go.sum

      - run: npm ci

      - name: The tag names the version being built
        if: github.event_name == 'push' || inputs.tag != ''
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      # Builds the app, checked against the full pp helper on every parity request, and trimmed
      # only if the trimmed one answers every pp and API parity request as the untrimmed one
      # does on this runner; then starts it from an unrelated directory to prove it finds osu!'s
      # calculators, and zips it. The step has a limit: a macOS runner has frozen whole before.
      - name: Package the C# app
        timeout-minutes: 30
        run: npm run package -- --native --rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    # A manual run without a tag is a dry run of the packaging on all three systems.
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the release, or attach the builds to it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          ls -l assets
          if gh release view "$tag" > /dev/null 2>&1; then
            # Written by hand already: keep its notes, replace any builds of the same name.
            gh release upload "$tag" assets/*.zip --clobber
          else
            node scripts/release-notes.mjs "$version" > notes.md
            gh release create "$tag" assets/*.zip \
              --title "osu! local profiles $version" \
              --notes-file notes.md \
              --verify-tag
          fi
