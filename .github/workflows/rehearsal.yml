# The switch-over rehearsal (docs/csharp-port.md, phase 8), on every platform a release ships
# for. Run by hand, in steps, since the releases rehearsed with are published to a test
# repository, which this workflow's token cannot write to:
#
#   1. The target: the release's own zips, from a dry run of release.yml (no tag), published to
#      the test repository as its latest release.
#   2. step: build. Each platform's C# release to update from (`from_cs`, older than the
#      target, its repository the test one), kept as this run's artifacts.
#   3. step: rehearse, with the build run's id. Installs of every old version from the oldest
#      that can update, and of `from_cs`, update to the target (scripts/rehearse-update.mjs).
name: Switch-over rehearsal

on:
  workflow_dispatch:
    inputs:
      step:
        description: build, or rehearse
        type: choice
        options: [build, rehearse]
        default: build
      build_run:
        description: For rehearse, the id of the build run whose zips to use
        required: false
      repo:
        description: The test repository
        default: jonathant09/osu-local-profiles-switchover-test
      target:
        description: The release to update to, the test repository's latest
        default: 1.33.0
      from_cs:
        description: The C# release to update from, older than the target
        default: 1.32.1

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.step == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/launcher/go.mod
          cache-dependency-path: tools/launcher/go.sum

      - run: npm ci

      # Built as a release is, with the version and the repository it would carry there.
      - name: Build the C# release to update from
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
          FROM_CS: ${{ inputs.from_cs }}
        run: |
          set -e
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.argv[1];
            p.repository.url = 'https://github.com/' + process.argv[2] + '.git';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          " "$FROM_CS" "$REPO"
          npm run package -- --native --rid ${{ matrix.rid }}
          mkdir -p rehearsal
          cp dist/osu-local-profiles-"$FROM_CS"-*.zip rehearsal/

      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-${{ matrix.rid }}
          path: rehearsal/*.zip
          retention-days: 7

  rehearse:
    if: inputs.step == 'rehearse'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # For the stand-in osu!stable install's generated replays.
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: rehearsal-${{ matrix.rid }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rehearsal

      # A display with no tray, as a desktop without one: the launcher runs without its icon,
      # and an update can start the app again.
      - name: A display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: Rehearse
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
          TARGET: ${{ inputs.target }}
          FROM_CS: ${{ inputs.from_cs }}
        run: |
          run=(node scripts/rehearse-update.mjs --builds rehearsal --repo "$REPO" --target "$TARGET" --from-cs "$FROM_CS")
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${run[@]}"; else "${run[@]}"; fi
