name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # macOS and Linux support cannot be verified on the development machine, so CI is the
    # only thing that runs this project on them at all. `fail-fast: false` because a break
    # on one platform is exactly when the other two results are most worth having.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The tray launcher is Go. test/launcher.test.ts builds it and runs it against a stand-in
      # app, which is the only place its macOS and Linux builds are compiled before a release.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/launcher/go.mod
          cache-dependency-path: tools/launcher/go.sum

      - run: npm ci

      # pp comes from osu!'s own code, so the calculator has to exist before the tests
      # that assert pp against known-correct values can mean anything.
      - name: Build the pp calculator
        run: npm run build:pp

      - run: npm run typecheck

      # Several tests need a real osu! installation and a replay corpus, which a CI runner
      # does not have; those skip themselves. What still runs everywhere is the part that
      # can silently rot: accuracy, level, pp weighting, the rank curves' shape, profile
      # lifecycle, the backfill cutoff logic, and -- the reason this runs on three
      # platforms -- where each of them keeps osu!.
      - name: Test
        run: npm test

      # The app refuses to start without an osu! installation, which a runner has none of,
      # so this only proves it gets that far: modules load, the schema applies, and the pp
      # helper is found. Those are the parts that break on a platform nobody ran them on.
      - name: Start far enough to need osu!
        shell: bash
        run: |
          set -o pipefail
          output=$(node src/main.ts --check-only 2>&1) && status=0 || status=$?
          echo "$output"
          # Exit 1 with that banner is the expected outcome on a machine with no osu!.
          if [ "$status" -ne 0 ] && ! echo "$output" | grep -q 'No osu! installation found'; then
            echo "::error::the app failed before it got as far as looking for osu!"
            exit 1
          fi
          if ! echo "$output" | grep -q "pp: osu!'s official calculator"; then
            echo "::error::the pp calculator was not found -- scores would be tracked with no pp"
            exit 1
          fi
